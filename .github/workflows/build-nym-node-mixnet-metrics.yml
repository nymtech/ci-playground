name: Build Nym-Node (mixnet-metrics, tokio_unstable)

on:
  workflow_dispatch:

env:
  # `tokio_unstable` is a --cfg, not a cargo feature, so it goes through RUSTFLAGS. Setting it at
  # the job level means the whole build (tokio included) is compiled with it, which enables tokio's
  # unstable RuntimeMetrics API and therefore the cfg-gated tokio_runtime_busy_ratio /
  # tokio_runtime_worker_poll_count metrics on this branch (the other tokio_runtime_* + mixnet
  # packet metrics are always compiled in regardless).
  RUSTFLAGS: "--cfg tokio_unstable"

jobs:
  publish-nym:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get -y install ripgrep libwebkit2gtk-4.0-dev build-essential curl wget libssl-dev libgtk-3-dev libudev-dev squashfs-tools
        continue-on-error: true

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          repository: nymtech/nym
          ref: feat/mixnet-improvements

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build nym-node (release, tokio_unstable)
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --bin nym-node --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nym-node-mixnet-metrics
          path: |
            target/release/nym-node
          retention-days: 30

      - name: Prepare build output directory
        shell: bash
        env:
          OUTPUT_DIR: ci-builds/nym-node/feat/mixnet-improvements
        run: |
          rm -rf ci-builds || true
          mkdir -p $OUTPUT_DIR
          echo $OUTPUT_DIR

      - name: Prepare build output
        shell: bash
        env:
          OUTPUT_DIR: ci-builds/nym-node/feat/mixnet-improvements
        run: |
          cp target/release/nym-node $OUTPUT_DIR

      - name: Deploy branch to CI www
        continue-on-error: true
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CI_WWW_SSH_PRIVATE_KEY }}
          ARGS: "-avzr"
          SOURCE: "ci-builds/"
          REMOTE_HOST: ${{ secrets.CI_WWW_REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.CI_WWW_REMOTE_USER }}
          TARGET: ${{ secrets.CI_WWW_REMOTE_TARGET }}/builds/
          EXCLUDE: "/dist/, /node_modules/"
